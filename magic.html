<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zenmart</title>

    <style>
      .navbar_frame {
        position: relative;
        width: 100%;
        height: 145px;
        background-color: rgb(80, 6, 150);
        display: flex;
        flex-direction: row;
        justify-content: center;
      }

      .navbar_frame .container {
        position: relative;
        padding: 20px 0 14px;
        width: 1320px;
        height: auto; /*
    background-color: red;*/
      }

      .navbar_frame .container .navbar_top {
        width: 100%;
        height: 50px;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        /*
background-color: yellowgreen;*/
      }

      .navbar_top .nav_search_frame {
        width: 651px;
        height: 50px;
        border-radius: 6px;

        display: flex;
        flex-direction: row;

        background: rgb(255, 255, 255);
      }

      .nav_search_frame .search_box {
        padding: 10px 17px;
        display: flex;
        flex-direction: row;

        align-items: center;
      }

      .search_box .category_list {
        width: 166px;
        height: 30px;

        border-right: 1px solid rgb(214, 214, 214);
      }

      .category_list select {
        width: 140px;

        height: 30px;

        border: none;

        outline: none;

        color: rgb(4, 30, 66);

        font-family: Jost;

        font-size: 15px;

        font-weight: 400;

        line-height: 22px;

        letter-spacing: 0%;
      }

      .search_box input {
        margin-left: 12px;

        width: 387px;

        height: 22px;

        border: none;

        outline: none;

        color: rgb(98, 105, 116);

        font-family: Jost;

        font-size: 15px;

        font-weight: 400;

        line-height: 22px;

        letter-spacing: 0%;

        text-align: left;
      }

      .nav_search_frame .search_icon_box {
        width: 50px;
        height: 50px;

        display: flex;
        justify-content: center;
        align-items: center;

        border-radius: 0px 6px 6px 0px;
        background: rgb(245, 195, 75);
      }

      .navbar_top .nav_top_menu {
        width: 416px;
        height: 50px;
        display: flex;
        flex-direction: row; /*
    background-color: red;*/
        justify-content: space-between;
      }

      .nav_top_menu .top_menu_box {
        display: flex;
        flex-direction: row;
      }

      .top_menu_box .box_icon_box {
        position: relative;

        width: 54px;
        height: 50px;

        display: flex;
        justify-content: center;
        align-items: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
      }

      .top_menu_box .box_info_box {
        margin-left: 16px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      .box_info_box span {
        /* [object Object] */

        color: rgb(255, 255, 255);

        font-family: Jost;

        font-size: 16px;

        font-weight: 400;

        line-height: 22px;

        letter-spacing: 0%;

        text-align: left;
      }

      .box_info_box strong {
        /* [object Object] */

        color: rgb(255, 255, 255);

        font-family: Jost;

        font-size: 16px;

        font-weight: 500;

        line-height: 22px;

        letter-spacing: 0%;

        text-align: left;
      }

      .box_icon_box img {
        width: 22px;
        height: 22px;
      }

      .box_icon_box .basket_count {
        position: absolute;

        top: 0;
        right: 0;

        width: 15px;

        height: 15px;

        display: flex;

        justify-content: center;

        align-items: center;

        border-radius: 50%;

        background: rgb(245, 195, 75);

        color: rgb(11, 30, 64);

        font-family: Jost;

        font-size: 8px;

        font-weight: 700;

        line-height: 10px;

        letter-spacing: 0%;

        text-align: left;
      }

      .navbar_frame .container .navbar_bott {
        margin-top: 20px;
        border-top: 1px solid #5747a2;
      }

      /*  */
      .navbar_bott .navbar_bott_menu_box {
        margin-top: 10px;
        height: 20px;

        display: flex;
        flex-direction: row;
        justify-content: space-between;
      }

      .navbar_bott .browse_box {
        width: 185px;
        margin-top: 10px;
        display: flex;
        flex-direction: row;
        align-items: center;

        border-right: 1px solid #5747a2;
      }

      .browse_box img {
        width: 20px;
        height: 18px;
      }

      .browse_box span {
        margin-left: 10px;

        color: rgb(255, 255, 255);

        font-family: Jost;

        font-size: 16px;

        font-weight: 400;

        line-height: 28px;

        letter-spacing: 0%;

        text-align: left;
      }

      .navbar_bott_menu_box .navbar_route_menu {
        width: 670px;

        display: flex;
        flex-direction: row;
        /*
    margin-left: 95px;
    margin-bottom: 75px;*/
      }

      .navbar_route_menu a {
        /*
    margin-left: 95px;
    margin-bottom: 35px;*/
        margin-right: 10px;

        /* 16/Medium */

        font-family: Jost;

        font-size: 16px;
        font-weight: 400;

        color: #fff;
      }

      .navbar_route_menu a.title {
        color: #f5c34b;
      }

      .sorting_menu span {
        /* 16/Medium */

        margin-left: 10px;

        color: rgb(255, 255, 255);

        font-family: Jost;

        font-size: 16px;

        font-weight: 400;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./public/css/command.css" />
    <link rel="stylesheet" href="./public/css/home.css" />
  </head>
  <body>
    <div class="navbar_frame">
      <div class="container">
        <div class="navbar_top">
          <a href=",/index.html">
            <img src="./public/images/icons/logo.png" alt="" />
          </a>

          <div class="nav_search_frame">
            <div class="search_box">
              <div class="category_list">
                <select name="id">
                  <option value="All" selected>All Categories</option>
                  <option value="Computer">Computer</option>
                </select>
              </div>
              <input type="text" placeholder="Search product..." />
            </div>
            <div class="search_icon_box">
              <img src="./public/images/icons/search.svg" alt="" />
            </div>
          </div>

          <div class="nav_top_menu">
            <div class="top_menu_box">
              <div class="box_icon_box">
                <img src="./public/images/icons/heart.svg" />
              </div>
              <div class="box_info_box">
                <span>Wishlist</span>
                <strong>My Items</strong>
              </div>
            </div>
            <div class="top_menu_box">
              <div class="box_icon_box">
                <img src="./public/images/icons/profile.svg" />
              </div>

              <div class="box_info_box">
                <span>Sign In</span>

                <strong>Account</strong>
              </div>
            </div>

            <div class="top_menu_box">
              <div class="box_icon_box">
                <div class="basket_count">2</div>

                <img src="./public/images/icons/shopping-cart.svg" />
              </div>

              <div class="box_info_box">
                <span>$200 </span>

                <strong>Total</strong>
              </div>
            </div>
            <div></div>
            <div></div>
          </div>
        </div>
        <div class="navbar_bott">
          <div class="navbar_bott_menu_box">
            <div class="browse_box">
              <img src="./public/images/icons/browse.svg" alt="" />
              <span>Browse Categories</span>
            </div>

            <div class="navbar_route_menu">
              <a href="" class="title">Home</a>
              <a href="">Shop</a>
              <a href="">Orders</a>
              <a href="">About</a>
              <a href="">Contact</a>
            </div>

            <div class="sorting_menu">
              <span>Deal of the Day</span>
              <span>Hot Deals</span>
              <span>Best Sellers</span>
              <span>New Arrivals</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
